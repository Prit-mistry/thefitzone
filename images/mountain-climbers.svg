<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Mountain Climbers: start and finish positions" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="640" height="360" fill="#151815"/>
